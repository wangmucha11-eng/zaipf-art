<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Zai Pengfei</title>
  <meta name="description" content="Zai Pengfei — artist based in Shanghai. Works & archive." />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: rgba(0, 0, 0, 0.9);
      --fg-soft: rgba(0, 0, 0, 0.6);
      --fg-muted: rgba(0, 0, 0, 0.3);
      --border: rgba(0, 0, 0, 0.08);
      --surface: #ffffff;
      --pad: 1rem;
      --viewport-height: 100dvh;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body {
      font-family: "Diatype Variable", "Helvetica", sans-serif;
      font-size: 0.88rem;
      font-weight: 350;
      line-height: 1.6;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 2rem;
      pointer-events: none;
    }
    .site-nav > * { pointer-events: auto; }
    .nav-left, .nav-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-left { flex-direction: column; align-items: flex-start; gap: 0.2rem; }
    .nav-right a, .lang-toggle {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.3s ease, color 0.4s ease;
    }
    .nav-right a:hover { opacity: 1 !important; }
    .nav-left span, .nav-left a {
      font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #000000;
      transform: translateY(-1px);
      transition: color 0.4s ease;
    }
    .nav-brand { text-decoration: none; }
    .lang-toggle { cursor: pointer; display: flex; gap: 0.5rem; }
    .lang-toggle span.is-active { text-decoration: underline; text-underline-offset: 2px; }
    .lang-toggle span:hover { opacity: 0.6; }

    /* Language Toggle Visibility */
    html[lang="en"] .lang-zh { display: none !important; }
    html[lang="zh-CN"] .lang-en { display: none !important; }

    /* Exhibition poster wall — same pattern as the home page */
    .exh-page {
      padding: 10rem 2rem 6rem;
      width: 100%;
      max-width: 96rem;
      margin: 0 auto;
    }
    .exh-page-title {
      font-family: "Diatype Variable", "Helvetica", sans-serif;
      font-size: 1rem;
      font-weight: 350;
      letter-spacing: 0.02em;
      color: var(--fg);
      margin-bottom: 3.5rem;
      text-align: center;
    }
    .exh-posters {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 3rem;
    }
    .exh-poster {
      flex: 0 0 auto;
      min-width: 0;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .exh-poster:hover { opacity: 0.75; }
    .exh-poster img {
      display: block;
      height: 22rem;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      background: var(--surface);
    }
    .exh-poster-info {
      margin-top: 1.5rem;
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: var(--fg);
    }

    /* overlay - full screen experience (same as home) */
    .overlay-root {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      overflow-y: auto;
    }
    .overlay-root.is-open { opacity: 1; visibility: visible; }
    .overlay-container { max-width: 85rem; margin: 0 auto; padding: 10rem 2rem; }
    .overlay-head {
      position: fixed;
      top: 1.5rem; left: 2rem; right: 2rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1.5rem;
      z-index: 210;
    }
    .lang-toggle-overlay { font-size: 0.72rem; color: var(--fg); }
    .overlay-close {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
      cursor: pointer;
      transition: opacity 0.3s ease;
      background: none;
      border: none;
      padding: 0;
    }
    .overlay-close:hover { opacity: 1; color: var(--fg); }
    .overlay-content { display: flex; flex-direction: column; gap: 12rem; }
    .work-item { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .work-item-images { width: 100%; margin-bottom: 3rem; }
    .work-item-images img {
      max-width: 100%;
      max-height: 85vh;
      margin-bottom: 4rem;
      object-fit: contain;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .work-item-meta {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.7rem;
      line-height: 1.8;
      color: var(--fg-soft);
      letter-spacing: 0.04em;
    }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2rem);
      -webkit-backdrop-filter: blur(2rem);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: min(92vw, 56rem);
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    /* site footer */
    .site-footer { padding: 10rem 2rem 1.5rem; display: flex; justify-content: flex-end; text-align: right; }
    .footer-right {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1.5;
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 820px) {
      .nav-right { gap: 0.85rem; font-size: 0.95rem; }
      .exh-page { padding: 6rem 1.25rem 5rem; }
      .exh-posters {
        flex-wrap: wrap;
        gap: 3.5rem 2.5rem;
      }
      /* mobile: uniform WIDTH, height follows each poster's ratio */
      .exh-poster img { width: min(14rem, 42vw); height: auto; max-width: 100%; }
      .overlay-container { padding: 7rem 1.25rem; }
      .overlay-content { gap: 6rem; }
      .site-footer { padding: 6rem 1.25rem 1.25rem; }
    }

    @media (max-width: 480px) {
      .site-nav { padding: 1rem 1.25rem; }
      .nav-right { gap: 0.7rem; }
      .nav-right a { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
<header class="site-nav" data-od-id="site-nav">
    <div class="nav-left">
      <a href="index.html" id="nav-desc" class="nav-brand">Zai Pengfei Studio</a>
    </div>
    <nav class="nav-right" data-od-id="nav-links">
      <div class="lang-toggle" id="lang-toggle">
        <span data-lang="en" class="is-active">EN</span>
        <span>/</span>
        <span data-lang="zh">中</span>
      </div>
      <a href="index.html" style="opacity: 0.5;">HOME</a>
      <a href="about.html" style="opacity: 0.5;">ABOUT</a>
    </nav>
  </header>
  <main>
    <div class="exh-page">
      <div class="exh-page-title">
        <span class="lang-en">Exhibition Views</span>
        <span class="lang-zh">展览现场</span>
      </div>
      <div class="exh-posters" id="exh-posters">
        <!-- Injected from site.json -->
      </div>
    </div>
  </main>

  <div class="overlay-root" id="overlay-root" data-od-id="project-overlay" aria-hidden="true">
    <div class="overlay-head">
      <button type="button" class="overlay-close" id="overlay-close" aria-label="关闭" data-od-id="overlay-close">CLOSE</button>
      <div class="lang-toggle lang-toggle-overlay" id="lang-toggle-overlay">
        <span data-lang="en" class="is-active">EN</span>
        <span>/</span>
        <span data-lang="zh">中</span>
      </div>
    </div>
    <div class="overlay-container">
      <article class="overlay-content" id="overlay-card"></article>
    </div>
  </div>

  <div class="lightbox" id="lightbox" data-od-id="lightbox" aria-hidden="true">
    <img id="lightbox-img" alt="" />
  </div>

  <script>
    let CURRENT_LANG = "en";

    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const SITE = { overlays: {} };

    // Split a mixed "中文\n\nEnglish" field and return the part for CURRENT_LANG.
    function langPart(text) {
      if (!text) return "";
      const parts = String(text).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      if (parts.length <= 1) return text;
      const zhBlocks = [], enBlocks = [];
      for (const p of parts) {
        if (/[\u4e00-\u9fff]/.test(p)) zhBlocks.push(p);
        else if (/[A-Za-z]{2,}/.test(p)) enBlocks.push(p);
        else zhBlocks.push(p);
      }
      const zh = zhBlocks.join("\n\n"), en = enBlocks.join("\n\n");
      if (!en) return zh;
      if (!zh) return en;
      return CURRENT_LANG === "zh" ? zh : en;
    }

    // "English / 中文" style fields
    function enZhPart(text) {
      if (!text) return "";
      const parts = String(text).split("/").map(s => s.trim());
      if (parts.length === 1) return text;
      return CURRENT_LANG === "zh" ? parts[parts.length - 1] : parts[0];
    }

    const EXH_KEYS = ["exh-driving-void", "exh-dwelling-nowhere", "exh-equal-temperament", "exh-texture-time"];
    const EXH_POSTERS = {
      "exh-driving-void": "assets/images-web/zl_post1_xukong.JPG",
      "exh-dwelling-nowhere": "assets/images-web/zl_post2_wuzhu.JPG",
      "exh-equal-temperament": "assets/images-web/zl_post3_pingjunlv.JPG",
      "exh-texture-time": "assets/images-web/zl_post4_shijian.JPG"
    };

    // Poster wall — one poster + name per exhibition (same as home page)
    function renderPosters() {
      const root = $("#exh-posters");
      if (!root) return;
      root.innerHTML = EXH_KEYS.map(key => {
        const ov = SITE.overlays[key];
        if (!ov || !ov.items || !ov.items[0]) return "";
        const it = ov.items[0];
        const title = enZhPart(it.title);
        const cover = EXH_POSTERS[key] || ((it.images && it.images[0]) ? it.images[0] : "");
        return `
          <div class="exh-poster" onclick="openOverlay('${esc(key)}')">
            <img loading="lazy" decoding="async" src="${esc(cover)}" alt="${esc(title)}" />
            <div class="exh-poster-info">${esc(title)}</div>
          </div>`;
      }).join("");
    }

    function openOverlay(id, targetIndex = 0) {
      const data = SITE.overlays[id];
      if (!data) return;
      SITE.overlayKey = id;
      SITE.overlayIndex = targetIndex;
      const card = $("#overlay-card");
      const itemsHtml = (data.items || []).map((item, idx) => {
        const imgs = (item.images || []).map((src) =>
          `<img src="${esc(src)}" alt="" loading="lazy" data-full="${esc(src)}" />`
        ).join("");
        const metaParts = [
          enZhPart(item.title),
          item.specs,
          enZhPart(item.media),
          item.year
        ].filter(Boolean);
        return `
          <div class="work-item" id="item-${id}-${idx}">
            <header style="text-align: left; width: 100%; margin-bottom: 8rem;">
              <h1 style="font-family: 'Diatype Variable', sans-serif; font-size: 0.95rem; font-weight: 450; margin-bottom: 2rem; letter-spacing: -0.01em;">${esc(enZhPart(item.title))}</h1>
              <div style="font-family: 'Diatype Variable', sans-serif; font-size: 0.78rem; line-height: 1.7; color: var(--fg-soft); white-space: pre-line; max-width: 38rem;">${esc(langPart(item.statement))}</div>
            </header>
            <div class="work-item-images">${imgs}</div>
            <footer class="work-item-meta" style="text-align: left; width: 100%; margin-top: 2rem;">
              <div style="font-family: 'Diatype Mono Variable', monospace; font-size: 0.65rem; line-height: 2; color: var(--fg-muted); text-transform: uppercase;">
                ${metaParts.slice(1).map(p => `<div>${esc(p)}</div>`).join("")}
              </div>
            </footer>
          </div>
        `;
      }).join("");
      card.innerHTML = itemsHtml;
      card.querySelectorAll("img[data-full]").forEach(img => {
        img.onclick = () => openLightbox(img.dataset.full);
      });
      const root = $("#overlay-root");
      root.classList.add("is-open");
      root.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => {
        const target = $(`#item-${id}-${targetIndex}`);
        if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
      }, 50);
      history.replaceState(null, "", "#" + id);
    }

    function closeOverlay() {
      const root = $("#overlay-root");
      root.classList.remove("is-open");
      root.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      history.replaceState(null, "", "#exhibitions");
    }

    function openLightbox(src) {
      $("#lightbox-img").src = src;
      $("#lightbox").classList.add("is-open");
    }
    function closeLightbox() {
      $("#lightbox").classList.remove("is-open");
    }

    function routeFromHash() {
      const h = (location.hash || "").slice(1);
      if (SITE.overlays[h]) openOverlay(h);
    }

    function setLanguage(lang) {
      if (lang !== "en" && lang !== "zh") return;
      CURRENT_LANG = lang;
      try { localStorage.setItem("zpf-lang", lang); } catch (_) {}
      document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
      [$("#lang-toggle"), $("#lang-toggle-overlay")].forEach(t => {
        if (t) t.querySelectorAll("span").forEach(s => s.classList.toggle("is-active", s.dataset.lang === lang));
      });
      renderPosters();
      const overlay = $("#overlay-root");
      if (overlay && overlay.classList.contains("is-open")) {
        const scrolled = overlay.scrollTop;
        openOverlay(SITE.overlayKey, SITE.overlayIndex);
        requestAnimationFrame(() => { overlay.scrollTop = scrolled; });
      }
    }

    function bindNav() {
      $("#overlay-close").onclick = closeOverlay;
      $("#lightbox").onclick = closeLightbox;
      window.onhashchange = routeFromHash;
      document.onkeydown = (e) => {
        if (e.key === "Escape") {
          if ($("#lightbox").classList.contains("is-open")) closeLightbox();
          else closeOverlay();
        }
      };
    }

    function bindLangToggle() {
      [$("#lang-toggle"), $("#lang-toggle-overlay")].filter(Boolean).forEach(toggle => {
        toggle.onclick = (e) => {
          const lang = e.target.dataset.lang;
          if (lang) setLanguage(lang);
        };
      });
    }

    async function boot() {
      // restore remembered language before rendering
      try {
        const saved = localStorage.getItem("zpf-lang");
        if (saved === "zh" || saved === "en") setLanguage(saved);
      } catch (_) {}
      try {
        const res = await fetch("data/site.json?v=2");
        if (res.ok) {
          const json = await res.json();
          SITE.overlays = json.overlays || {};
        }
      } catch (_) {}
      renderPosters();
      bindNav();
      bindLangToggle();
      routeFromHash();
    }
    boot();
  </script>
</body>
</html>
