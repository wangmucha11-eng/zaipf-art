<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Zai Pengfei</title>
  <meta name="description" content="Zai Pengfei — artist based in Shanghai. Works & archive." />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: rgba(0, 0, 0, 0.9);
      --fg-soft: rgba(0, 0, 0, 0.6);
      --fg-muted: rgba(0, 0, 0, 0.3);
      --border: rgba(0, 0, 0, 0.08);
      --surface: #ffffff;
      --pad: 1rem;
      --viewport-height: 100dvh;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body {
      font-family: "Diatype Variable", "Helvetica", sans-serif;
      font-size: 0.88rem;
      font-weight: 350;
      line-height: 1.6;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 2rem;
      pointer-events: none;
    }
    .site-nav > * { pointer-events: auto; }
    .nav-left, .nav-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-left { gap: 0.2rem; }
    .nav-right a, .lang-toggle {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.3s ease, color 0.4s ease;
    }
    .nav-right a:hover { opacity: 1 !important; }
    .nav-left span, .nav-left a {
      font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #000000;
      transform: translateY(-1px);
      transition: color 0.4s ease;
    }
    .nav-brand {
      text-decoration: none;
    }
    .lang-toggle {
      cursor: pointer;
      display: flex;
      gap: 0.5rem;
    }
    .lang-toggle span.is-active {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .lang-toggle span:hover { opacity: 0.6; }

    /* Hero section */
    .hero-view {
      height: 100vh;
      height: 100dvh; /* mobile browser chrome-safe */
      width: 100vw;
      width: 100dvw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0;
      overflow: hidden;
    }
    .hero-single {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      cursor: none; /* Hide default cursor only here */
    }
    .hero-single img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: difference;
      z-index: 2;
    }

    /* Custom Cursor */
    .cursor-dot {
      width: 30px;
      height: 30px;
      background-color: #ffffff;
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    /* Header dynamic color */
    .site-nav.is-on-hero .nav-left span,
    .site-nav.is-on-hero .nav-left a,
    .site-nav.is-on-hero .nav-right a,
    .site-nav.is-on-hero .lang-toggle {
      color: #ffffff;
    }
    .site-nav.is-on-hero .lang-toggle span {
      color: #ffffff;
    }

    /* overlay - full screen experience */
    .overlay-root {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      overflow-y: auto;
    }
    .overlay-root.is-open {
      opacity: 1;
      visibility: visible;
    }
    .overlay-container {
      max-width: 85rem;
      margin: 0 auto;
      padding: 7rem 2rem;
    }
    .overlay-head {
      position: fixed;
      top: 1.5rem; left: 2rem; right: 2rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1.5rem;
      z-index: 210;
    }
    .lang-toggle-overlay {
      font-size: 0.72rem;
      color: var(--fg);
    }
    .overlay-close {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
      cursor: pointer;
      transition: opacity 0.3s ease;
      background: none;
      border: none;
      padding: 0;
    }
    .overlay-close:hover { opacity: 1; color: var(--fg); }

    .overlay-content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .work-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .work-item-images {
      width: 100%;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }
    .work-item-images img {
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
      display: block;
    }
    .work-item-meta {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.7rem;
      line-height: 1.8;
      color: var(--fg-soft);
      letter-spacing: 0.04em;
    }

    /* Mixed Gallery Layout */
    /* Language Toggle Visibility */
    html[lang="en"] .lang-zh { display: none !important; }
    html[lang="zh-CN"] .lang-en { display: none !important; }

    /* White-cube gallery hall — the whole Inner section is one wall:
       intro wall (full viewport) + gallery wall, same colour down to baseboard */
    .hall-room {
      position: relative;
      z-index: 0;
      background-color: #f2f1ee;
    }

    /* Wall photo pinned to the viewport: keeps its true proportions on
       every screen (position:fixed works on iOS too, unlike
       background-attachment:fixed). Content scrolls over it. */
    .hall-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #f2f1ee;
      background-image: url("assets/images-web/beijing.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Section switch — quiet selector under the quote.
       Two words, generous tracking, active vs inactive only. */
    .hall-switch {
      margin-top: 5rem;
      display: flex;
      align-items: center;
      gap: 3.5rem;
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.85rem;
      font-weight: 350;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
    }
    .hall-switch-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: var(--fg);
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }
    .hall-switch-btn:hover { opacity: 0.8; }
    .hall-switch-btn.is-active { opacity: 1; }
    .hall-switch-sep {
      color: var(--fg-muted);
      opacity: 0.4;
    }

    /* Quote band between hero and the gallery wall — same wall colour,
       so the background switches only once (dark hero → wall).
       Full viewport: a whole screen of whitespace with only the quote. */
    .hall-quote {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 8rem 2rem;
    }
    .hall-quote .lang-en {
      font-family: "Diatype Variable", sans-serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.02em;
      color: var(--fg);
      max-width: 40rem;
    }
    .hall-quote .lang-zh {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.8rem;
      font-weight: 350;
      line-height: 2;
      letter-spacing: 0.08em;
      color: var(--fg-soft);
      margin-top: 1.2rem;
      max-width: 30rem;
    }

    /* Fixed two-line break on wide screens; on narrow screens the spans
       flow naturally (no odd forced breaks) */
    .hall-quote .quote-a { display: block; }
    .hall-quote .quote-b { display: inline; }

    /* Wall text hung on the same wall as the works (section label) */
    .gallery-text {
      flex: 0 0 auto;
      align-self: center;
      color: var(--fg);
    }
    .gallery-text-label {
      text-align: center;
      margin-right: 6rem;
    }
    .gallery-text-label .lang-en {
      font-family: "Diatype Variable", sans-serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.02em;
    }
    .gallery-text-label .lang-en span,
    .gallery-text-label .lang-zh span {
      display: block;
      font-family: "Diatype Variable", sans-serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.02em;
      opacity: 0.55;
      margin-top: 0.2rem;
    }
    .gallery-text-label .lang-zh {
      font-family: "Diatype Variable", sans-serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.02em;
    }
    .gallery-wall {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .gallery-wall::-webkit-scrollbar { display: none; }

    /* Scroll hint on the wall — near the baseboard, bottom-right;
       appears once the wall fills the viewport, fades on interaction */
    .gallery-hint {
      position: fixed;
      bottom: calc(4rem + 35px);
      right: 1.5rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .gallery-hint.is-hidden { opacity: 0; }
    .gallery-hint-arrow {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.6rem;
      color: var(--fg-muted);
      animation: hint-nudge 1.8s ease-in-out infinite;
    }
    .gallery-hint-label {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--fg-muted);
    }
    @keyframes hint-nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }

    /* Copyright sits on the wall, bottom-right — no separate white band */
    .hall-footer {
      padding: 0 1rem 0 2rem;
      line-height: 1.4;
      text-align: right;
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
    }
    .gallery-track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10.8rem;
      height: 100%;
      width: max-content;
      padding: 0 16vw;
    }
    .gallery-piece {
      flex: 0 0 auto;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gallery-piece:hover { opacity: 0.85; transform: translateY(-4px); }
    .gallery-piece img {
      display: block;
      object-fit: contain;
    }
    /* caption under a piece — quiet museum label, centred on the image */
    .gallery-caption {
      margin-top: 1.2rem;
      width: 100%;
      text-align: center;
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      line-height: 1.6;
      color: var(--fg-muted);
    }
    .gallery-caption span { display: block; }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2rem);
      -webkit-backdrop-filter: blur(2rem);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: min(92vw, 56rem);
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    @media (max-width: 820px) {
      .nav-right { gap: 0.85rem; font-size: 0.95rem; }

      /* tighten the oversized fixed spacing */
      .hall-quote { min-height: 100vh; min-height: 100dvh; padding: 5rem 1.5rem; }
      .hall-quote .lang-en { font-size: 0.95rem; }
      .hall-quote .lang-zh { font-size: 0.78rem; }
      .hall-switch { margin-top: 3rem; gap: 2.5rem; font-size: 0.8rem; }
      /* narrow screens: quote stays split at the dash (a on line 1, b on line 2) */
      .hall-quote .quote-a { display: block; }
      .hall-quote .quote-b { display: inline; }
      .overlay-container { padding: 7rem 1.25rem; }
      .overlay-content { gap: 1.5rem; }

      /* gallery wall — full viewport on phones */
      .gallery-wall {
        height: 100vh;
        height: 100dvh;
      }
      .gallery-track {
        gap: 5.4rem;
        padding: 0 30vw;
      }
      .gallery-piece img {
        max-width: 82vw;
        max-height: 58vh;
      }
      /* raise hint & copyright off the very edge on mobile */
      .gallery-hint { bottom: calc(4rem + 45px); }
      .hall-footer { padding: 0 1rem 10px 2rem; }
    }

    @media (max-width: 480px) {
      /* compact nav on small phones */
      .site-nav { padding: 1rem 1.25rem; }
      .nav-right { gap: 0.7rem; }
      .nav-right a { font-size: 0.68rem; }
      .hall-quote { min-height: 100vh; min-height: 100dvh; padding: 4rem 1.25rem; }
      .hall-quote .lang-en { font-size: 0.9rem; }
      .hall-quote .lang-zh { font-size: 0.75rem; }
      .gallery-wall { height: 100vh; height: 100dvh; }
      .gallery-track { gap: 4.8rem; padding: 0 34vw; }
      .gallery-piece img {
        max-width: 80vw;
        max-height: 52vh;
      }
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

    </section>
  </main>

  <div class="overlay-root" id="overlay-root" data-od-id="project-overlay" aria-hidden="true">
    <div class="overlay-head">
      <button type="button" class="overlay-close" id="overlay-close" aria-label="关闭" data-od-id="overlay-close">CLOSE</button>

      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    function applyBrand() {
      const b = SITE.brand;
      const name = TWEAK_DEFAULTS.brandName || b.displayName || b.name;
      document.title = name;
    }


    // Split a mixed "中文\n\nEnglish" field and return the part for CURRENT_LANG.
    // Groups consecutive blocks by language (zh blocks → zh version, en blocks → en version).
    function langPart(text) {
      if (!text) return "";
      const parts = String(text).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      if (parts.length <= 1) return text;
      const zhBlocks = [], enBlocks = [];
      for (const p of parts) {
        if (/[\u4e00-\u9fff]/.test(p)) zhBlocks.push(p);
        else if (/[A-Za-z]{2,}/.test(p)) enBlocks.push(p);
        else zhBlocks.push(p);
      }
      const zh = zhBlocks.join("\n\n"), en = enBlocks.join("\n\n");
      if (!en) return zh;
      if (!zh) return en;
      return CURRENT_LANG === "zh" ? zh : en;
    }
    // For "English / 中文" style fields — prefers explicit en/zh keys on the item
    function enZhPart(text, item, enKey, zhKey) {
      if (item) {
        const en = item[enKey], zh = item[zhKey];
        if (en && zh) return CURRENT_LANG === "zh" ? zh : en;
        if (en) return CURRENT_LANG === "zh" ? (zh || text) : en;
      }
      if (!text) return "";
      const parts = String(text).split("/").map(s => s.trim());
      if (parts.length === 1) return text;
      // assume "English / 中文"
      return CURRENT_LANG === "zh" ? parts[parts.length - 1] : parts[0];
    }

    function openOverlay(id, targetIndex = 0) {
      // defensive: keep CURRENT_LANG in sync with the document lang attribute
      const docLang = document.documentElement.getAttribute("lang");
      if (docLang === "zh-CN") CURRENT_LANG = "zh";
      else if (docLang === "en") CURRENT_LANG = "en";
      const data = SITE.overlays[id];
      if (!data) return;
      SITE.overlayKey = id;
      SITE.overlayIndex = targetIndex;
      const card = $("#overlay-card");
      // show only the selected work (one piece per screen)
      const item = (data.items || [])[targetIndex];
      if (!item) return;
      const idx = targetIndex;
      // Detail-page image list (wall overrides don't apply here unless set):
      // diapers drops its first image; sisyphus uses the transparent png.
      // Multi-item works (e.g. falling-paper: No.1 / No.2-14 / No.28-40)
      // show every item's image stacked together.
      let imgsSrc = (item.images || []).slice();
      if (id === "falling-paper") {
        imgsSrc = (data.items || []).reduce((acc, it) => acc.concat(it.images || []), []);
      }
      if (id === "diapers") imgsSrc = imgsSrc.slice(1);
      if (id === "sisyphus" && WALL_IMAGE_OVERRIDE[imgsSrc[0]]) imgsSrc[0] = WALL_IMAGE_OVERRIDE[imgsSrc[0]];
      // Driving in the Void: second image is the same photo, rotated vertical
      if (id === "driving-void") {
        imgsSrc = imgsSrc.map(s => s.endsWith("page_42_1.jpeg") ? "assets/images-web/page_42_1_vert.jpeg" : s);
      }
      const multi = imgsSrc.length > 1;
      const imgs = imgsSrc.map((src) => 
        `<img src="${esc(src)}" alt="" loading="lazy" data-full="${esc(src)}" ${multi ? 'data-multi="1"' : ""} />`
      ).join("");
      
      const metaParts = [
        enZhPart(item.title, item, "titleEn", "title"),
        item.specs,
        enZhPart(item.media, item, "mediaEn", "media"),
        item.year
      ].filter(Boolean);
      
      card.innerHTML = `
        <div class="work-item" id="item-${id}-${idx}">
          <header class="work-item-header" style="text-align: left; width: 100%; margin-bottom: 1.5rem;">
            <h1 style="font-family: 'Diatype Variable', sans-serif; font-size: 0.95rem; font-weight: 450; margin-bottom: 1rem; letter-spacing: -0.01em;">${esc(enZhPart(item.title, item, "titleEn", "title"))}</h1>
            <div style="font-family: 'Diatype Variable', sans-serif; font-size: 0.78rem; line-height: 1.7; color: var(--fg-soft); white-space: pre-line; max-width: 38rem;">${esc(langPart(item.statement))}</div>
          </header>
          
          <div class="work-item-images">${imgs}</div>
          
          <footer class="work-item-meta" style="text-align: left; width: 100%; margin-top: 1rem;">
            <div style="font-family: 'Diatype Mono Variable', monospace; font-size: 0.65rem; line-height: 2; color: var(--fg-muted); text-transform: uppercase;">
              ${metaParts.slice(1).map(p => `<div>${esc(p)}</div>`).join("")}
            </div>
          </footer>
        </div>
      `;
      card.querySelectorAll("img[data-full]").forEach(img => {
        img.onclick = () => openLightbox(img.dataset.full);
      });

      // Driving in the Void: keep every image the same width as the first
      // (they are different aspect ratios, so heights may differ)
      if (id === "driving-void") {
        const imgs = card.querySelectorAll(".work-item-images img");
        const first = imgs[0];
        if (first && imgs.length > 1) {
          first.onload = () => {
            const w = first.getBoundingClientRect().width;
            imgs.forEach(img => { img.style.width = w + "px"; img.style.maxHeight = "none"; });
          };
          if (first.complete && first.naturalWidth > 0) {
            const w = first.getBoundingClientRect().width;
            imgs.forEach(img => { img.style.width = w + "px"; img.style.maxHeight = "none"; });
          }
        }
      }

      const root = $("#overlay-root");
      root.classList.add("is-open");
      root.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      
      // Scroll to target item (usually at top already for a single piece)
      setTimeout(() => {
        const target = $(`#item-${id}-${idx}`);
        if (target) {
          target.scrollIntoView({ behavior: 'auto', block: 'start' });
        }
      }, 50);

      history.replaceState(null, "", "#" + id);
    }

    function closeOverlay() {
      const root = $("#overlay-root");
      root.classList.remove("is-open");
      root.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      history.replaceState(null, "", "#home");
    }

    function openLightbox(src) {
      $("#lightbox-img").src = src;
      $("#lightbox").classList.add("is-open");
    }
    function closeLightbox() {
      $("#lightbox").classList.remove("is-open");
    }

    // ---- White-cube gallery (inner works at real scale) ----
    // Parse "75 × 50 cm × 3" → [75, 50]; falls back to null.
    function parseSpecs(specs) {
      if (!specs) return null;
      const m = String(specs).match(/(\d+(?:\.\d+)?)\s*[×xX]\s*(\d+(?:\.\d+)?)/);
      if (!m) return null;
      return [parseFloat(m[1]), parseFloat(m[2])];
    }

    // Number of panels: trailing "× N" (after "cm") means N panels joined.
    function specCopies(specs) {
      if (!specs) return 1;
      const m = String(specs).match(/cm\s*[×xX]\s*(\d+)\s*$/i);
      return m ? parseInt(m[1], 10) : 1;
    }

    // Preload every image once to learn its true aspect ratio, so the
    // wall shows works in their real orientation (specs text is not
    // always consistent with the actual image).
    function preloadRatios(paths) {
      const map = {};
      return Promise.all(paths.map(p => new Promise((res) => {
        const im = new Image();
        im.onload = () => { map[p] = im.naturalWidth / im.naturalHeight; res(); };
        im.onerror = () => { map[p] = null; res(); };
        im.src = p;
      }))).then(() => map);
    }

    // Per-file height scale — fine-tuning by image filename. The height is
    // multiplied by the given factor, width scales proportionally.
    // Keys use the wall-display path (after WALL_IMAGE_OVERRIDE).
    const FILE_SCALE = {
      "assets/images-web/page_06.png": 1.3,
      "assets/images-web/page_08.png": 2.0,
      "assets/images-web/page_09.png": 2.0,
      "assets/images-web/page_10_1.jpeg": 2.0,
      "assets/images-web/page_12.png": 1.3,
      "assets/images-web/page_14_1.jpeg": 1.5,
      "assets/images-web/page_20.png": 1.5
    };

    // Per-work scale for the outer section (uniform area mode), keyed by
    // overlay id — lets a single piece stand out or recede.
    const OUTER_SCALE = {
      "a-rain": 1.5,
      "a-cup-of-water": 2.0,
      "sisyphus": 0.8,
      "diapers": 2.0,
      "falling-paper": 1.32
    };

    // Wall display image override — swap the file shown on the gallery wall
    // only; the overlay detail page keeps the original from site.json.
    const WALL_IMAGE_OVERRIDE = {
      "assets/images-web/page_32_1.jpeg": "assets/images-web/page_32_1.png",
      "assets/images-web/page_10.jpg": "assets/images-web/page_10_1.jpeg",
      "assets/images-web/page_43.jpg": "assets/images-web/page_43.png",
      "assets/images-web/page_23.jpeg": "assets/images-web/page_23.png",
      "assets/images-web/page_40_1.jpg": "assets/images-web/page_40_1.png",
      "assets/images-web/page_37_1.jpeg": "assets/images-web/page_38_1.jpeg"
    };

    // Build one piece: shape comes from the real image ratio, size from
    // the real area in specs — so 140×140cm clearly dwarfs a 27×27cm
    // work, and horizontal/vertical follows the photo, not the text.
    // entries: [{ key, index, it, title }] — key = overlay id to open.
    // opts.uniform: equal-area display (no real-size hierarchy);
    // opts.labels: show a small caption under each piece.
    function buildGalleryItems(entries, ratios, wallPx, baseMaxArea, opts = {}) {
      const info = entries.map(({ key, index, it, title }) => {
        const dims = parseSpecs(it.specs);
        const copies = specCopies(it.specs);
        const raw = (it.images && it.images[0]) ? it.images[0] : "";
        const src = WALL_IMAGE_OVERRIDE[raw] || raw;
        const area = dims ? dims[0] * dims[1] * copies : 0;
        const ratio = ratios[src] || (dims ? dims[0] / dims[1] : 1);
        return { key, index, it, title, dims, area, ratio, src };
      });
      // shared scale across inner & outer so their works read at the
      // same physical size; baseMaxArea comes from the largest work overall
      const maxArea = baseMaxArea || Math.max.apply(null, info.map(x => x.area).concat(1));
      // the largest work's height ≈ wall height; others scale by area
      const pxPerSide = wallPx / Math.sqrt(maxArea);
      return info.map(({ key, index, it, title, dims, area, ratio, src }) => {
        let wPx = 240, hPx = 300; // fallback for unparsable specs
        if (opts.uniform) {
          // equal area for every work, keep each image's own aspect ratio;
          // per-work OUTER_SCALE lets a single piece stand out or recede
          const s = OUTER_SCALE[key] || 1;
          const side = wallPx * 0.5 * s;
          wPx = side * Math.sqrt(ratio);
          hPx = side / Math.sqrt(ratio);
          const k = Math.min(1, wallPx / Math.max(wPx, hPx));
          wPx = Math.max(60, wPx * k);
          hPx = Math.max(60, hPx * k);
        } else if (dims && area > 0) {
          const side = Math.sqrt(area) * pxPerSide;
          // guard: never let a work exceed the wall height
          const k = Math.min(1, wallPx / Math.max(side * Math.sqrt(ratio), side / Math.sqrt(ratio)));
          wPx = Math.max(44, side * Math.sqrt(ratio) * k);
          hPx = Math.max(44, side / Math.sqrt(ratio) * k);
        }
        // per-file fine-tuning: scale height, keep aspect ratio
        const f = FILE_SCALE[src];
        if (f && !opts.uniform) {
          const k2 = Math.min(1, wallPx / (hPx * f));
          hPx *= f * k2;
          wPx *= f * k2;
        }
        const pieceTitle = title || enZhPart(it.title, it, "titleEn", "title");
        const caption = opts.labels ? captionHtml(pieceTitle) : "";
        return `
          <div class="gallery-piece" data-overlay="${esc(key)}" data-index="${index}">
            <img loading="lazy" decoding="async" src="${esc(src)}" alt="${esc(pieceTitle)}"
                 style="width:${Math.round(wPx)}px; height:${Math.round(hPx)}px;" />
            ${caption}
          </div>`;
      });
    }

    // Split a bilingual title ("A Rain (一场雨)" or "A Rain / 一场雨")
    // into both language spans (CSS picks the active one).
    function captionHtml(text) {
      if (!text) return "";
      let en = "", zh = "";
      const paren = String(text).match(/^(.*?)[（(]([^（）()]*)[)）]\s*$/);
      if (paren) {
        en = paren[1].trim();
        zh = paren[2].trim();
      } else {
        const parts = String(text).split("/").map(s => s.trim()).filter(Boolean);
        en = parts[0] || "";
        zh = parts[1] || "";
      }
      if (!zh) { en = text.trim(); zh = ""; }
      return `<div class="gallery-caption"><span class="lang-en">${esc(en)}</span>${zh ? `<span class="lang-zh">${esc(zh)}</span>` : ""}</div>`;
    }

    // Wall text hung on the same wall, before the works: the section label
    function wallTextHtml(view) {
      if (view === "outer") {
        return `
          <div class="gallery-text gallery-text-label">
            <div class="lang-en">investigate things and extend knowledge</div>
            <div class="lang-zh">《格物致知》</div>
          </div>`;
      }
      return `
        <div class="gallery-text gallery-text-label">
          <div class="lang-en">Motion Sickness Pills</div>
          <div class="lang-zh">《晕车药》</div>
        </div>`;
    }

    const INNER_KEY = "motion-sickness-pills";
    const OUTER_KEYS = ["a-rain", "a-cup-of-water", "falling-paper", "sisyphus", "driving-void", "diapers"];
    let CURRENT_VIEW = "inner";

    async function renderGallery(view = CURRENT_VIEW) {
      const gallery = $("#inner-gallery");
      if (!gallery) return;
      let entries = [];
      let opts = {};
      if (view === "outer") {
        // each outer project = one piece; equal area + a caption,
        // so the section reads balanced rather than real-scale
        opts = { uniform: true, labels: true };
        OUTER_KEYS.forEach(key => {
          const ov = SITE.overlays[key];
          if (ov && ov.items && ov.items[0]) {
            entries.push({ key, index: 0, it: ov.items[0], title: ov.title });
          }
        });
      } else {
        const ov = SITE.overlays[INNER_KEY];
        ((ov && ov.items) || []).forEach((it, idx) => entries.push({ key: INNER_KEY, index: idx, it }));
      }
      const srcs = entries.map(e => {
        const raw = (e.it.images && e.it.images[0]) ? e.it.images[0] : "";
        return WALL_IMAGE_OVERRIDE[raw] || raw;
      }).filter(Boolean);
      const ratios = await preloadRatios(srcs);
      const wallPx = Math.round((window.innerHeight || 900) * 0.55);
      // Shared scale: the inner series' largest work (140×140cm) fills the
      // wall; the outer works scale on the same ruler so both sections read
      // at the same physical size. Oversized works are capped by wall height.
      const baseMaxArea = 19600;
      const html = buildGalleryItems(entries, ratios, wallPx, baseMaxArea, opts);
      gallery.innerHTML = `<div class="gallery-track">${wallTextHtml(view)}${html.join("")}</div>`;
      gallery.scrollLeft = 0;
      CURRENT_VIEW = view;
      // sync the switch marker
      document.querySelectorAll(".hall-switch-btn").forEach(btn => {
        btn.classList.toggle("is-active", btn.dataset.view === view);
      });
      initGalleryHint(gallery);
    }

    // Scroll hint: visible only while the wall is on screen, there is more
    // wall to the right, and the visitor hasn't scrolled yet.
    function initGalleryHint(gallery) {
      const hint = $("#gallery-hint");
      if (!hint) return;
      const update = () => {
        const overflows = gallery.scrollWidth > gallery.clientWidth + 1;
        const scrolled = gallery.scrollLeft > 2;
        const r = gallery.getBoundingClientRect();
        // show only once the wall has filled most of the viewport
        const onScreen = r.top < window.innerHeight * 0.5 && r.bottom > 0;
        hint.classList.toggle("is-hidden", !overflows || scrolled || !onScreen);
      };
      gallery.removeEventListener("scroll", update);
      gallery.addEventListener("scroll", update, { passive: true });
      window.removeEventListener("resize", update);
      window.addEventListener("resize", update);
      window.removeEventListener("scroll", update, true);
      window.addEventListener("scroll", update, { passive: true, capture: true });
      // images load lazily and change scrollWidth — poll until they settle
      let tries = 0;
      const poll = () => {
        update();
        const imgs = gallery.querySelectorAll("img");
        const done = Array.from(imgs).every(img => img.complete && img.naturalWidth > 0);
        if (!done && tries < 40) { tries++; setTimeout(poll, 250); }
      };
      requestAnimationFrame(poll);
      setTimeout(poll, 500);
    }

    function routeFromHash() {
      const h = (location.hash || "#home").slice(1);
      if (h === "inner" || h === "outer") {
        if (h !== CURRENT_VIEW) renderGallery(h);
        return;
      }
      if (SITE.overlays[h]) {
        openOverlay(h);
      }
    }

    function bindLangToggle() {
      const toggles = [$("#lang-toggle"), $("#lang-toggle-overlay")].filter(Boolean);
      toggles.forEach(toggle => {
        toggle.onclick = (e) => {
          const lang = e.target.dataset.lang;
          if (!lang) return;
          setLanguage(lang);
        };
      });
    }

    function setLanguage(lang) {
      if (lang !== "en" && lang !== "zh") return;
      CURRENT_LANG = lang;
      try { localStorage.setItem("zpf-lang", lang); } catch (_) {}
      document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
      // sync active state on every toggle (nav + overlay)
      [$("#lang-toggle"), $("#lang-toggle-overlay")].forEach(t => {
        if (t) t.querySelectorAll("span").forEach(s => s.classList.toggle("is-active", s.dataset.lang === lang));
      });
      // re-render an open overlay in the new language, preserving scroll position
      const overlay = $("#overlay-root");
      if (overlay && overlay.classList.contains("is-open")) {
        const scrolled = overlay.scrollTop;
        openOverlay(SITE.overlayKey, SITE.overlayIndex);
        requestAnimationFrame(() => { overlay.scrollTop = scrolled; });
      }
    }

    function bindNav() {
      const gallery = $("#inner-gallery");
      if (gallery) {
        gallery.onclick = (e) => {
          const piece = e.target.closest(".gallery-piece");
          if (piece) {
            const overlay = piece.dataset.overlay || INNER_KEY;
            const index = Number(piece.dataset.index);
            if (Number.isInteger(index) && index >= 0) {
              openOverlay(overlay, index);
            }
          }
        };
      }

      // Inner / Outer section switch — switch content and glide down to
      // the wall, unless the wall is already mostly on screen
      document.querySelectorAll(".hall-switch-btn").forEach(btn => {
        btn.onclick = () => {
          const view = btn.dataset.view;
          if (view === "inner" || view === "outer") {
            history.replaceState(null, "", "#" + view);
            renderGallery(view);
            const wall = $("#inner-gallery");
            if (wall) {
              const r = wall.getBoundingClientRect();
              const already = r.top < window.innerHeight * 0.6 && r.bottom > 0;
              if (!already) wall.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          }
        };
      });

      $("#overlay-close").onclick = closeOverlay;
      $("#lightbox").onclick = closeLightbox;
      window.onhashchange = routeFromHash;
      document.onkeydown = (e) => {
        if (e.key === "Escape") {
          if ($("#lightbox").classList.contains("is-open")) closeLightbox();
          else closeOverlay();
        }
      };
    }

    function initCursor() {
      const cursor = $("#cursor-dot");
      const hero = $(".hero-single");
      let mouseX = 0, mouseY = 0;
      let ballX = 0, ballY = 0;
      let speed = 0;
      let lastX = 0, lastY = 0;
      let isOverHero = false;

      window.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      hero.addEventListener("mouseenter", () => { isOverHero = true; });
      hero.addEventListener("mouseleave", () => { isOverHero = false; });

      function animate() {
        // Elastic following (Lerp)
        ballX += (mouseX - ballX) * 0.15;
        ballY += (mouseY - ballY) * 0.15;

        // Velocity & Direction for stretch
        const dx = ballX - lastX;
        const dy = ballY - lastY;
        speed = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);
        
        // Stretch formula
        const stretch = Math.min(speed * 0.05, 1.2);
        const scaleX = 1 + stretch;
        const scaleY = 1 - stretch * 0.5;

        // Handle visibility and transform
        cursor.style.opacity = isOverHero ? "1" : "0";
        cursor.style.transform = `translate(${ballX - 15}px, ${ballY - 15}px) rotate(${angle}deg) scale(${scaleX}, ${scaleY})`;

        lastX = ballX;
        lastY = ballY;
        requestAnimationFrame(animate);
      }
      animate();
    }

    function initHeroBounce() {
      const canvas = $("#hero-canvas");
      const hero = $(".hero-single");
      if (!canvas || !hero) return;
      const ctx = canvas.getContext("2d");

      const R = 15;             // ball radius — matches cursor dot (30px)
      const GRAVITY = 0.32;     // px / frame^2 — slower, weightier
      const BOUNCE = 0.86;      // higher = higher bounces
      const FRICTION = 0.97;    // horizontal friction on each bounce
      const REST = 0.6;         // below this vertical speed the ball settles
      const STOP_VX = 0.6;      // below this horizontal speed the ball stops on landing
      const START_VX = 2.4;     // initial rightward speed

      let W = 0, H = 0, DPR = 1;
      let ground = 0;           // ball center rests at ground - R
      let ball = null;          // { x, y, vx, vy }
      let trail = [];           // points on the dashed path — kept until next click
      let dots = [];            // beads resting at every click point
      let running = false;
      let visible = true;

      function resize() {
        const r = hero.getBoundingClientRect();
        W = Math.max(1, r.width);
        H = Math.max(1, r.height);
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        // ball lowest point keeps 15% of the image height above the bottom
        ground = H * 0.85;
        if (!running && trail.length > 1) draw();
      }
      resize();
      window.addEventListener("resize", resize);

      // Only animate while the hero is actually on screen
      const io = new IntersectionObserver((entries) => {
        visible = entries[0].isIntersecting;
      }, { threshold: 0.05 });
      io.observe(hero);

      function launch(x, y) {
        // fresh set: previous start bead, end ball and dash all disappear together
        dots = [{ x, y: Math.min(y, ground - R) }];
        ball = { x, y: Math.min(y, ground - R), vx: START_VX, vy: 0, bounces: 0 };
        trail = [];
        if (!running) { running = true; requestAnimationFrame(tick); }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        // beads resting at each click point — same size as the main ball
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        for (const d of dots) {
          ctx.beginPath();
          ctx.arc(d.x, d.y, R, 0, Math.PI * 2);
          ctx.fill();
        }
        // dashed trajectory — arcs only, no straight vertical/horizontal runs
        if (trail.length > 1) {
          ctx.strokeStyle = "rgba(255,255,255,0.55)";
          ctx.lineWidth = 1.4;
          ctx.setLineDash([6, 7]);
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (ball) {
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function tick() {
        if (!running) return;
        if (visible && ball) {
          ball.vy += GRAVITY;
          ball.x += ball.vx;
          ball.y += ball.vy;

          // ground — bounce with decaying energy (max 4), then settle softly
          if (ball.y + R >= ground) {
            ball.y = ground - R;
            if (ball.bounces < 4 && Math.abs(ball.vy) > REST && Math.abs(ball.vx) >= STOP_VX) {
              ball.bounces++;
              // each bounce loses more energy → speed keeps slowing naturally
              const decay = BOUNCE - ball.bounces * 0.06;
              ball.vy = -ball.vy * Math.max(decay, 0.4);
              ball.vx *= FRICTION;
            } else if (Math.abs(ball.vy) > REST) {
              // soft micro-bounce after the last full bounce — eases to a stop
              ball.vy = -ball.vy * 0.22;
              ball.vx *= 0.5;
            } else {
              ball.vy = 0;
              ball.vx = 0;
            }
          }

          trail.push({ x: ball.x, y: ball.y });
        }
        draw();

        // stop once the ball is fully at rest; the drawing stays on canvas
        if (ball && ball.vy === 0 && ball.vx === 0 && ball.y + R >= ground) {
          running = false;
          return;
        }
        requestAnimationFrame(tick);
      }

      // Interaction: only the bottom 15% margin is reserved — anywhere else triggers
      hero.addEventListener("pointerdown", (e) => {
        const r = hero.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        launch(x, y);
      });
    }

    function initHeaderColor() {
      const nav = $(".site-nav");
      const hero = $(".hero-view");
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          // If hero is NOT intersecting (scrolled past), remove white color
          if (entry.isIntersecting) {
            nav.classList.add("is-on-hero");
          } else {
            nav.classList.remove("is-on-hero");
          }
        });
      }, {
        // Trigger when the very top of the hero leaves the top of viewport
        threshold: 0,
        rootMargin: "-80px 0px 0px 0px" // Adjust based on header height
      });
      
      observer.observe(hero);
    }

    function initImageProtection() {
      // 1. block right-click on images (and the whole page context menu for save)
      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest("img")) e.preventDefault();
      });
      // 2. block drag-to-download
      document.addEventListener("dragstart", (e) => {
        if (e.target.tagName === "IMG") e.preventDefault();
      });
      // 3. block Ctrl/Cmd+S (save page), Ctrl/Cmd+P (print), Ctrl/Cmd+U (view source)
      document.addEventListener("keydown", (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && ["s", "p", "u"].includes(e.key.toLowerCase())) {
          e.preventDefault();
        }
      });
    }

    function initGalleryWheel() {
      const wall = $("#inner-gallery");
      if (!wall) return;
      // Direction-aware wheel handling:
      // - vertical (up/down, including a plain mouse wheel) scrolls the page
      // - horizontal (trackpad two-finger side swipe) travels along the wall
      wall.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) return;
        e.preventDefault();
        wall.scrollLeft += e.deltaX;
      }, { passive: false });
    }

    async function boot() {
      // restore remembered language before any rendering
      try {
        const saved = localStorage.getItem("zpf-lang");
        if (saved === "zh" || saved === "en") setLanguage(saved);
      } catch (_) {}
      try {
        const res = await fetch("data/site.json?v=4");
        if (res.ok) {
          const json = await res.json();
          Object.assign(SITE.brand, json.brand);
          SITE.projects = json.projects || [];
          SITE.overlays = json.overlays || {};
        }
      } catch (_) {}
      initImageProtection();
      applyBrand();
      bindLangToggle();
      initGalleryWheel();
      bindNav();
      await renderGallery("inner");
      initCursor();
      initHeroBounce();
      initHeaderColor();
      routeFromHash();
    }
    boot();
  </script>
</body>
</html>
