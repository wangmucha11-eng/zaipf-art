<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Zai Pengfei</title>
  <meta name="description" content="Zai Pengfei — artist based in Shanghai. Works & archive." />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: rgba(0, 0, 0, 0.9);
      --fg-soft: rgba(0, 0, 0, 0.6);
      --fg-muted: rgba(0, 0, 0, 0.3);
      --border: rgba(0, 0, 0, 0.08);
      --surface: #ffffff;
      --pad: 1rem;
      --viewport-height: 100dvh;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body {
      font-family: "Diatype Variable", "Helvetica", sans-serif;
      font-size: 0.88rem;
      font-weight: 350;
      line-height: 1.6;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 2rem;
      pointer-events: none;
    }
    .site-nav > * { pointer-events: auto; }
    .nav-left, .nav-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-left { flex-direction: column; align-items: flex-start; gap: 0.2rem; }
    .nav-right a, .lang-toggle {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.3s ease, color 0.4s ease;
    }
    .nav-right a:hover { opacity: 1 !important; }
    .nav-left span, .nav-left a {
      font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #000000;
      transform: translateY(-1px);
      transition: color 0.4s ease;
    }
    .nav-brand {
      text-decoration: none;
    }
    .lang-toggle {
      cursor: pointer;
      display: flex;
      gap: 0.5rem;
    }
    .lang-toggle span.is-active {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .lang-toggle span:hover { opacity: 0.6; }

    /* Hero section */
    .hero-view {
      height: 100vh;
      height: 100dvh; /* mobile browser chrome-safe */
      width: 100vw;
      width: 100dvw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0;
      overflow: hidden;
    }
    .hero-single {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      cursor: none; /* Hide default cursor only here */
    }
    .hero-single img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: difference;
      z-index: 2;
    }

    /* Custom Cursor */
    .cursor-dot {
      width: 30px;
      height: 30px;
      background-color: #ffffff;
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    /* Header dynamic color */
    .site-nav.is-on-hero .nav-left span,
    .site-nav.is-on-hero .nav-right a,
    .site-nav.is-on-hero .lang-toggle {
      color: #ffffff;
    }
    .site-nav.is-on-hero .lang-toggle span {
      color: #ffffff;
    }

    /* overlay - full screen experience */
    .overlay-root {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      overflow-y: auto;
    }
    .overlay-root.is-open {
      opacity: 1;
      visibility: visible;
    }
    .overlay-container {
      max-width: 85rem;
      margin: 0 auto;
      padding: 10rem 2rem;
    }
    .overlay-head {
      position: fixed;
      top: 1.5rem; left: 2rem; right: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 210;
    }
    .lang-toggle-overlay {
      font-size: 0.72rem;
      color: var(--fg);
    }
    .overlay-close {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
      cursor: pointer;
      transition: opacity 0.3s ease;
      background: none;
      border: none;
      padding: 0;
    }
    .overlay-close:hover { opacity: 1; color: var(--fg); }

    .overlay-content {
      display: flex;
      flex-direction: column;
      gap: 12rem;
    }
    .work-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .work-item-images {
      width: 100%;
      margin-bottom: 3rem;
    }
    .work-item-images img {
      max-width: 100%;
      max-height: 85vh;
      margin-bottom: 4rem;
      object-fit: contain;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .work-item-meta {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.7rem;
      line-height: 1.8;
      color: var(--fg-soft);
      letter-spacing: 0.04em;
    }

    /* Mixed Gallery Layout */
    /* Language Toggle Visibility */
    html[lang="en"] .lang-zh { display: none !important; }
    html[lang="zh-CN"] .lang-en { display: none !important; }
    
    .section-label {
      font-family: "Diatype Variable", "Helvetica", sans-serif;
      font-size: 1.0rem;
      font-weight: 350;
      letter-spacing: 0.02em;
      color: var(--fg);
      margin: 14rem 0 6rem;
      text-align: center;
      width: 100%;
      line-height: 1.4;
    }
    .section-label .lang-en {
      font-family: "Gaisyr", serif;
      font-weight: 300;
    }
    .section-label.is-first { margin-top: 0; }
    .section-label span {
      display: block;
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      font-weight: 400;
      opacity: 0.4;
      margin-top: 0.75rem;
      letter-spacing: 0.05em;
    }
    
    .inner-slider {
      display: flex;
      overflow-x: auto;
      gap: 5rem;
      width: 100%;
      padding: 0 2rem 4rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .inner-slider::-webkit-scrollbar { display: none; }
    
    .inner-card {
      flex: 0 0 auto;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .inner-card:hover { opacity: 0.7; }
    .inner-card img {
      height: 51vh;
      width: auto;
      max-width: 85vh;
      object-fit: contain;
      display: block;
    }
    .inner-card img.small-painting {
      padding: 12.75vh 0;
    }

    .slider-wrap {
      position: relative;
    }
    .slider-fade {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 4rem;
      width: 5rem;
      z-index: 3;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.5) 85%);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    .slider-wrap:has(.inner-slider) .slider-fade { bottom: 4rem; }
    .slider-wrap.is-at-end .slider-fade {
      opacity: 0;
    }

    .outer-slider {
      display: flex;
      overflow-x: auto;
      gap: 3rem;
      width: 100%;
      padding: 0 2rem 4rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .outer-slider::-webkit-scrollbar { display: none; }
    
    .outer-card {
      flex: 0 0 auto;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .outer-card:hover { opacity: 0.7; }
    .outer-card img {
      height: 51vh;
      width: auto;
      max-width: 85vh;
      object-fit: contain;
      display: block;
    }
    .outer-info {
      margin-top: 1.5rem;
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.4;
      color: var(--fg);
    }
    /* about / information styling */
    .info-page {
      padding: 14rem 2rem;
      width: 100%;
      scroll-margin-top: 15vh;
    }
    .bio-content {
      display: grid;
      grid-template-columns: 1fr 2.5fr;
      gap: 4rem;
      align-items: start;
      scroll-margin-top: 15vh;
    }
    .bio-sidebar {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      line-height: 1.4;
      color: var(--fg);
      position: sticky;
      top: 15vh;
    }
    .bio-main {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.76rem;
      line-height: 1.2;
      color: var(--fg);
      text-align: left;
    }
    .bio-item {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.05rem;
    }
    .bio-item-year {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      color: var(--fg);
      flex: 0 0 2.75rem;
      white-space: nowrap;
    }
    .bio-item-text {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.76rem;
      line-height: 1.2;
    }
    .bio-text-block {
      margin-bottom: 0.8rem;
    }
    .bio-section-title {
      font-weight: 500;
      margin-top: 0.4rem;
    }

    /* site footer adjustment */
    .site-footer {
      padding: 10rem 2rem 1.5rem;
      display: flex;
      justify-content: flex-end;
      text-align: right;
    }
    .footer-right {
      font-family: "Diatype Mono Variable", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1.5;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .contact-list a {
      color: var(--fg);
      text-decoration: none;
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.76rem;
      line-height: 1.2;
      transition: opacity 0.3s ease;
    }
    .contact-list a:hover {
      opacity: 0.6;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .gallery-quote {
      text-align: center;
      margin: 12.3rem auto 21rem; /* top ≈ 10 lines, bottom tuned */
      max-width: 48rem;
      padding: 0 2rem;
    }
    .gallery-quote .lang-en {
      font-family: "Gaisyr", serif;
      font-size: 0.82rem;
      font-weight: 300;
      line-height: 1.5;
      color: var(--fg);
    }
    .gallery-quote .lang-zh {
      font-family: "Diatype Variable", sans-serif;
      font-size: 0.82rem;
      font-weight: 350;
      line-height: 1.8;
      color: var(--fg-soft);
      letter-spacing: 0.05em;
    }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2rem);
      -webkit-backdrop-filter: blur(2rem);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: min(92vw, 56rem);
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    @media (max-width: 820px) {
      .nav-right { gap: 0.85rem; font-size: 0.95rem; }
      .info-page { padding-top: 5rem; }

      /* about → single column */
      .bio-content {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }
      .bio-sidebar {
        position: static;
        top: auto;
      }
      .bio-item {
        gap: 1rem;
      }
      .bio-item-year {
        flex: 0 0 2.75rem;
      }

      /* tighten the oversized fixed spacing */
      .section-label { margin: 7rem 0 3.5rem; }
      .gallery-quote { margin: 6.5rem auto 6.5rem; }
      .overlay-container { padding: 7rem 1.25rem; }
      .overlay-content { gap: 6rem; }
      .info-page { padding: 6rem 1.25rem 8rem; }
      .site-footer { padding: 6rem 1.25rem 1.25rem; }

      /* sliders — smaller image height on phones */
      .inner-card img, .outer-card img {
        height: 38vh;
        max-width: 92vw;
      }
      .inner-card img.small-painting {
        padding: 9.5vh 0;
      }
      .inner-slider, .outer-slider {
        gap: 2.5rem;
        padding: 0 1.25rem 4rem;
      }
    }

    @media (max-width: 480px) {
      /* compact nav on small phones */
      .site-nav { padding: 1rem 1.25rem; }
      .nav-right { gap: 0.7rem; }
      .nav-right a { font-size: 0.68rem; }
      .gallery-quote { margin: 5rem auto 5rem; }
      .section-label { margin: 5rem 0 2.5rem; }
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
<header class="site-nav" data-od-id="site-nav">
    <div class="nav-left">
      <a href="index.html" id="nav-desc" class="nav-brand">Zai Pengfei Studio</a>
    </div>
    <nav class="nav-right" data-od-id="nav-links">
      <div class="lang-toggle" id="lang-toggle">
        <span data-lang="en" class="is-active">EN</span>
        <span>/</span>
        <span data-lang="zh">中</span>
      </div>
      <a href="exhibitions.html" style="opacity: 0.5;">EXHIBITIONS</a>
      <a href="index.html" style="opacity: 0.5;">HOME</a>
    </nav>
  </header>
  <main>
    <div id="bio-anchor" class="info-page">
      <!-- Injected bio content -->
    </div>
  </main>
  <script>
    let CURRENT_LANG = "en";

    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const SITE = { brand: null };

    function renderBio(targetId) {
      const b = SITE.brand;
      const root = $(targetId);
      if (!root || !b) return;
      const bioText = CURRENT_LANG === "zh" ? b.bioZh : b.bioEn;
      const sidebarLabel = CURRENT_LANG === "zh" ? "关于艺术家" : "ABOUT THE ARTIST";
      const contactLabel = CURRENT_LANG === "zh" ? "联系方式" : "CONTACT";
      const redLabel = CURRENT_LANG === "zh" ? "小红书" : "RED";
      const emailLabel = CURRENT_LANG === "zh" ? "邮箱" : "Email";

      const lines = String(bioText).split("\n");
      let structuredHtml = "";
      let lastYear = "", pendingYear = "";
      for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        if (!trimmed) {
          // gap after a year block is small; gap before a section title is large
          const next = (lines[i + 1] || "").trim();
          const h = /^\d{4}$/.test(next) ? "0.8rem" : "2.4rem";
          structuredHtml += '<div style="height: ' + h + ';"></div>';
          pendingYear = ""; lastYear = "";
          continue;
        }
        if (/^\d{4}$/.test(trimmed)) { pendingYear = trimmed; continue; }
        const yearMatch = trimmed.match(/^(\d{4})\s+(.+)/);
        let currentYear = "", content = trimmed;
        if (yearMatch) { currentYear = yearMatch[1]; content = yearMatch[2]; }
        else if (pendingYear) { currentYear = pendingYear; }
        if (currentYear) {
          const displayYear = (currentYear === lastYear) ? "" : currentYear;
          lastYear = currentYear;
          structuredHtml += '<div class="bio-item"><div class="bio-item-year">' + esc(displayYear) + '</div><div class="bio-item-text">' + esc(content) + '</div></div>';
        } else {
          const isTitle = /Solo Exhibitions|Select Exhibitions|个展|部分展览/.test(trimmed);
          const cls = isTitle ? 'bio-text-block bio-section-title' : 'bio-text-block';
          structuredHtml += '<div class="' + cls + '">' + esc(trimmed) + '</div>';
          lastYear = ""; pendingYear = "";
        }
      }

      root.innerHTML =
        '<div class="bio-content"><aside class="bio-sidebar">' + esc(sidebarLabel) + '</aside><div class="bio-main">' + structuredHtml + '</div></div>' +
        '<div class="bio-content" id="contact-anchor" style="margin-top: 6rem;"><aside class="bio-sidebar">' + esc(contactLabel) + '</aside><div class="bio-main contact-list">' +
          '<a href="https://www.instagram.com/zai.p.f9527/" target="_blank">Instagram: @zai.p.f9527</a>' +
          '<a href="https://www.xiaohongshu.com/user/profile/6020a8240000000001009855?xsec_token=AB2pSX2a-8gtW7vW9HMvDB-yBia-CLKUSutzrWlKc7xRY%3D&amp;xsec_source=pc_search" target="_blank">' + esc(redLabel) + ': Zai.P.F</a>' +
          '<a href="mailto:zai.p.f1994@gmail.com">' + esc(emailLabel) + ': zai.p.f1994@gmail.com</a>' +
        '</div></div>';
    }

    function setLanguage(lang) {
      if (lang !== "en" && lang !== "zh") return;
      CURRENT_LANG = lang;
      try { localStorage.setItem("zpf-lang", lang); } catch (_) {}
      document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
      const t = $("#lang-toggle");
      if (t) t.querySelectorAll("span").forEach(s => s.classList.toggle("is-active", s.dataset.lang === lang));
      renderBio("#bio-anchor");
    }

    function bindLangToggle() {
      const toggle = $("#lang-toggle");
      if (!toggle) return;
      toggle.onclick = (e) => {
        const lang = e.target.dataset.lang;
        if (lang) setLanguage(lang);
      };
    }

    async function boot() {
      // restore remembered language before rendering
      try {
        const saved = localStorage.getItem("zpf-lang");
        if (saved === "zh" || saved === "en") setLanguage(saved);
      } catch (_) {}
      try {
        const res = await fetch("data/site.json");
        if (res.ok) {
          const json = await res.json();
          SITE.brand = json.brand || null;
        }
      } catch (_) {}
      if (!SITE.brand) return;
      renderBio("#bio-anchor");
      bindLangToggle();
    }
    boot();
  </script>
</body>
</html>
